name: Build Kernel for sirius-SDM710

on:
  workflow_dispatch:
    inputs:
      enable_all_roots:
        description: '构建所有 Root 管理器（矩阵构建）'
        required: false
        default: false
        type: boolean
      enable_kernelsu:
        description: '启用 KernelSU (RKSU) 支持'
        required: false
        default: false
        type: boolean
      enable_resukisu:
        description: '启用 BakaSU (原ReSukiSU) 支持'
        required: false
        default: true
        type: boolean
      enable_susfs:
        description: '启用 SUSFS'
        required: false
        default: false
        type: boolean
      enable_bbr:
        description: "启用 BBR 加速"
        required: false
        default: false
        type: boolean
      enable_nomount:
        description: '启用 NoMount VFS 挂载'
        required: false
        default: true
        type: boolean
      enable_lxc_docker:
        description: '启用 LXC / Docker 支持 (需要 KernelSU)'
        required: false
        default: false
        type: boolean
      enable_kvm:
        description: '启用 KVM 支持'
        required: false
        default: false
        type: boolean

env:
  # AOSP 官方 Clang 9.0.1 (r353983c) tar.gz —— 适配 Linux 4.9 内核
  CLANG_TARBALL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android10-release/clang-r353983c.tar.gz"

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      root-configs: ${{ steps.set-matrix.outputs.root-configs }}
      total-count: ${{ steps.set-matrix.outputs.total-count }}
    steps:
      - name: 设置矩阵配置
        id: set-matrix
        env:
          ENABLE_ALL_ROOTS: ${{ inputs.enable_all_roots }}
          ENABLE_KERNELSU: ${{ inputs.enable_kernelsu }}
          ENABLE_RESUKISU: ${{ inputs.enable_resukisu }}
        run: |
          if [ "$ENABLE_ALL_ROOTS" = "true" ]; then
            ROOT_CONFIGS='["kernelsu","resukisu"]'
            TOTAL_COUNT=2
          else
            ROOT_LIST=""
            if [ "$ENABLE_KERNELSU" = "true" ]; then
              ROOT_LIST="${ROOT_LIST} kernelsu"
            fi
            if [ "$ENABLE_RESUKISU" = "true" ]; then
              ROOT_LIST="${ROOT_LIST} resukisu"
            fi
            if [ -z "$ROOT_LIST" ]; then
              ROOT_LIST="none"
            fi
            ROOT_CONFIGS=$(echo $ROOT_LIST | tr ' ' '\n' | jq -R . | jq -s -c .)
            TOTAL_COUNT=$(echo "$ROOT_CONFIGS" | jq length)
          fi
          echo "root-configs=$ROOT_CONFIGS" >> $GITHUB_OUTPUT
          echo "total-count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          echo "Root 配置: $ROOT_CONFIGS"
          echo "总数: $TOTAL_COUNT"

  prepare:
    needs: setup-matrix
    if: |
      needs.setup-matrix.outputs.total-count != '0' &&
      needs.setup-matrix.outputs.root-configs != '["none"]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 生成发布标签
        id: tag
        env:
          ROOT_CONFIGS: ${{ needs.setup-matrix.outputs.root-configs }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          ENABLE_BBR: ${{ inputs.enable_bbr }}
          ENABLE_LXC_DOCKER: ${{ inputs.enable_lxc_docker }}
          ENABLE_KVM: ${{ inputs.enable_kvm }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_DATE=$(date -u +'%Y%m%d')
          COUNT=$(echo "$ROOT_CONFIGS" | jq length)
          if [ "$COUNT" -gt 1 ]; then
            BASE="All"
          elif [ "$COUNT" -eq 1 ]; then
            BASE=$(echo "$ROOT_CONFIGS" | jq -r '.[0]')
          else
            BASE="none"
          fi
          SUFFIX="$BASE"
          if [ "$ENABLE_LXC_DOCKER" = "true" ]; then SUFFIX="${SUFFIX}-Docker"; fi
          if [ "$ENABLE_KVM" = "true" ]; then SUFFIX="${SUFFIX}-KVM"; fi
          if [ "$ENABLE_BBR" = "true" ]; then SUFFIX="${SUFFIX}-BBR"; fi
          if [ "$ENABLE_SUSFS" = "true" ]; then SUFFIX="${SUFFIX}-SUSFS"; fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then SUFFIX="${SUFFIX}-NoMount"; fi
          TAG="${BASE_DATE}-${SUFFIX}-build.${RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "发布标签: ${TAG}"

  build:
    needs: [setup-matrix, prepare]
    if: |
      needs.setup-matrix.outputs.total-count != '0' &&
      needs.setup-matrix.outputs.root-configs != '["none"]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: ${{ fromJson(needs.setup-matrix.outputs.root-configs) }}
      fail-fast: false
    env:
      ROOT_TYPE: ${{ matrix.root }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
      ENABLE_BBR: ${{ inputs.enable_bbr }}
      ENABLE_LXC_DOCKER: ${{ inputs.enable_lxc_docker }}
      ENABLE_KVM: ${{ inputs.enable_kvm }}
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: 设置构建环境
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install \
            git make bc bison ccache openssl dos2unix zip kmod cpio flex \
            libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler \
            ca-certificates python3 binutils binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi jq
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: 下载 GCC 工具链 (64 位和 32 位)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir -p gcc64
          wget -O gcc-aarch64.tar.gz --tries=3 --timeout=30 \
            https://github.com/EnderPhantomWing/android_kernel_xiaomi_sdm710/releases/download/gcc/64android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
          mkdir -p gcc32
          wget -O gcc-arm.tar.gz --tries=3 --timeout=30 \
            https://github.com/EnderPhantomWing/android_kernel_xiaomi_sdm710/releases/download/gcc/32android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxvf gcc-arm.tar.gz

      - name: 检查工具链中的 ld
        run: |
          echo "=== 查找 aarch64 ld ==="
          find $GITHUB_WORKSPACE/kernel_workspace/gcc64 -maxdepth 3 -name "*-ld*" -type f 2>/dev/null
          find $GITHUB_WORKSPACE/kernel_workspace/gcc64 -maxdepth 3 -name "ld*" 2>/dev/null
          echo "=== 查找 arm ld ==="
          find $GITHUB_WORKSPACE/kernel_workspace/gcc32 -maxdepth 3 -name "*-ld*" -type f 2>/dev/null
          find $GITHUB_WORKSPACE/kernel_workspace/gcc32 -maxdepth 3 -name "ld*" 2>/dev/null

      - name: 下载老版 Clang 工具链 (AOSP 官方 tar.gz, Clang 9.0.1 r353983c)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm -rf clang-aosp
          mkdir -p clang-aosp
          echo "URL: ${{ env.CLANG_TARBALL }}"
          wget -q --tries=3 --timeout=120 "${{ env.CLANG_TARBALL }}" -O clang.tar.gz \
            || { echo "!! 下载 Clang 失败"; exit 1; }
          tar -xzf clang.tar.gz -C clang-aosp
          ls -la clang-aosp/ | head -n 20
          $GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin/clang --version
          ls -la $GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin/ | grep -E 'ld|lld|gold' || true

      - name: 下载内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone --depth=1 https://github.com/EnderPhantomWing/rocky7842_android_kernel_xiaomi_sdm710.git android-kernel

      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-sirius-sdm710-${{ matrix.root }}-clang9
          max-size: 2G

      - name: KernelSU - 应用旧版补丁
        if: matrix.root == 'kernelsu'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          wget https://github.com/rksuorg/kernel_patches/raw/master/manual_hook/kernel-4.9.patch -O ksu-4.9.patch
          patch -p1 < ksu-4.9.patch || { echo "补丁应用失败"; exit 1; }

      - name: BakaSU (原ReSukiSU) - 应用旧版补丁
        if: matrix.root == 'resukisu'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          wget https://github.com/ReSukiSU/ReSukiSU_Patches/raw/main/scope-minimized/kernel-4.9.patch -O ksu-4.9.patch
          patch -p1 < ksu-4.9.patch || { echo "补丁应用失败"; exit 1; }

      - name: SUSFS - 启用 SUSFS
        if: env.ENABLE_SUSFS == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          wget https://raw.githubusercontent.com/sanba0519/Kernel-patch/refs/heads/main/susfs_patch_to_4.9.patch -O susfs-4.9.patch
          patch -p1 -F 3 < susfs-4.9.patch || { echo "SUSFS 补丁应用失败"; exit 1; }
          sed -i 's/^orig_flow:$/orig_flow:;/' fs/notify/fdinfo.c
          grep -q '^orig_flow:;$' fs/notify/fdinfo.c \
            || { echo "SUSFS fdinfo 兼容性修复失败"; exit 1; }

      - name: NoMount - 启用 VFS 挂载
        if: env.ENABLE_NOMOUNT == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          curl -LfsS \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh \
            -o nomount-setup.sh \
            || { echo "下载 NoMount setup 脚本失败"; exit 1; }
          bash nomount-setup.sh dev

      - name: KernelSU - 注入核心代码
        id: ksuinline
        if: matrix.root == 'kernelsu'
        run: |
          git clone --bare https://github.com/rsuntk/KernelSU.git
          cd KernelSU.git
          COUNT=$(git rev-list --count HEAD)
          KSU_MANAGER_VERSION_CODE=$((29971 + COUNT))
          echo "ksu_manager_version_code=$KSU_MANAGER_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "$KSU_MANAGER_VERSION_CODE" > "$GITHUB_WORKSPACE/kernel_workspace/manager_version_kernelsu.txt"
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash
          if [ "$ENABLE_SUSFS" = "true" ]; then
            curl -LfsS \
              https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh \
              -o susfs_inline_hook_patches.sh
            bash susfs_inline_hook_patches.sh
          fi

      - name: BakaSU (原ReSukiSU) - 注入核心代码 + SUSFS 内联钩子
        id: resukisuinline
        if: matrix.root == 'resukisu'
        run: |
          git clone --bare https://github.com/Baka-SU/BakaSU.git
          cd BakaSU.git
          COUNT=$(git rev-list --count HEAD)
          RESUKISU_MANAGER_VERSION_CODE=$((30000 + COUNT + 700))
          echo "resukisu_manager_version_code=$RESUKISU_MANAGER_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "$RESUKISU_MANAGER_VERSION_CODE" > "$GITHUB_WORKSPACE/kernel_workspace/manager_version_resukisu.txt"
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          if [ "$ENABLE_SUSFS" = "true" ]; then
            curl -LfsS \
              https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh \
              -o susfs_inline_hook_patches.sh
            bash susfs_inline_hook_patches.sh
          fi

      # ============================================================
      # 【关键修复】adsprpc / ION 兼容性
      #   1) ion_import_dma_buf_fd -> ion_import_dma_buf（保留）
      #   2) msm_ion_do_cache_offset_op 重复符号
      #      注意！该函数定义在头文件 msm_ion.h 里，不在 adsprpc.c 里
      #      所以真正修复目标是：drivers/staging/android/ion/msm/msm_ion.h
      # ============================================================
      - name: 修复 adsprpc ION API 兼容性 + 重复符号
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          echo "=== [1/2] 修复 ion_import_dma_buf_fd -> ion_import_dma_buf ==="
          for f in drivers/char/adsprpc.c drivers/char/adsprpc_compat.c; do
            if [ -f "$f" ]; then
              sed -i 's/\bion_import_dma_buf_fd\b/ion_import_dma_buf/g' "$f"
              echo "已处理: $f"
            fi
          done
          if grep -Rn "ion_import_dma_buf_fd" drivers/ include/ 2>/dev/null; then
            echo "!! 仍有 ion_import_dma_buf_fd 残留"
          else
            echo "无 ion_import_dma_buf_fd 残留"
          fi

          echo "=== [2/2] 修复 msm_ion_do_cache_offset_op 重复符号 ==="
          HDR=drivers/staging/android/ion/msm/msm_ion.h
          if [ ! -f "$HDR" ]; then
            echo "!! 找不到 $HDR"
          else
            echo "--- 修复前 $HDR:200-215 ---"
            sed -n '200,215p' "$HDR"

            # 情况 A：已经是 static / static inline，不动
            if grep -qE 'static[[:space:]]+(inline[[:space:]]+)?[^;]*msm_ion_do_cache_offset_op' "$HDR"; then
              echo "已经是 static (inline)，跳过"
            else
              # 情况 B：给函数定义加 static inline
              # 先尝试匹配 'int msm_ion_do_cache_offset_op('
              sed -i -E 's/^([[:space:]]*)int([[:space:]]+msm_ion_do_cache_offset_op[[:space:]]*\()/\1static inline int\2/' "$HDR"
              # 再尝试其它返回类型
              sed -i -E 's/^([[:space:]]*)(void|long|unsigned[[:space:]]+long)([[:space:]]+msm_ion_do_cache_offset_op[[:space:]]*\()/\1static inline \2\3/' "$HDR"
            fi

            echo "--- 修复后 $HDR:200-215 ---"
            sed -n '200,215p' "$HDR"

            echo "--- grep 检查 ---"
            grep -n "msm_ion_do_cache_offset_op" "$HDR" || echo "该文件里已无此符号"
          fi

      - name: pinctrl include 修复（drivers/ 全范围）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          fix_include() {
            local sym="$1"
            local hdr="$2"
            local count=0
            for F in $(grep -rl "\b$sym\b" --include='*.c' drivers/ 2>/dev/null); do
              if ! grep -q "#include <$hdr>" "$F"; then
                if grep -q '#include <linux/input.h>' "$F"; then
                  sed -i "\|#include <linux/input.h>|a #include <$hdr>" "$F"
                elif grep -q '#include <linux/device.h>' "$F"; then
                  sed -i "\|#include <linux/device.h>|a #include <$hdr>" "$F"
                else
                  sed -i "1i #include <$hdr>" "$F"
                fi
                echo "[已修复 $sym] $F"
                count=$((count+1))
              fi
            done
            echo "符号 $sym -> 共修复 $count 个文件"
          }

          fix_include pinctrl_select_state  linux/pinctrl/consumer.h
          fix_include pinctrl_lookup_state  linux/pinctrl/consumer.h
          fix_include devm_pinctrl_get      linux/pinctrl/consumer.h
          fix_include devm_pinctrl_put      linux/pinctrl/consumer.h
          fix_include pinctrl_get           linux/pinctrl/consumer.h
          fix_include pinctrl_put           linux/pinctrl/consumer.h

      - name: LXC/Docker - 启用内核配置
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://github.com/wu17481748/android-lxc-docker/releases/download/lxc-docker-2config/LXC-DOCKER-OPEN-CONFIG.sh
          chmod +x LXC-DOCKER-OPEN-CONFIG.sh
          ./LXC-DOCKER-OPEN-CONFIG.sh android-kernel/arch/arm64/configs/sirius_defconfig -w

      - name: LXC/Docker - 禁用 task_turbo 模块
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          sed -i '/CONFIG_MTK_TASK_TURBO/d' arch/arm64/configs/sirius_defconfig
          echo "# CONFIG_MTK_TASK_TURBO is not set" >> arch/arm64/configs/sirius_defconfig

      - name: LXC/Docker - 应用 runc 补丁
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://raw.githubusercontent.com/tomxi1997/lxc-docker-support-for-android/refs/heads/main/runcpatch.sh
          chmod +x runcpatch.sh
          if [ -f android-kernel/kernel/cgroup.c ]; then ./runcpatch.sh android-kernel/kernel/cgroup.c; fi
          if [ -f android-kernel/kernel/cgroup/cgroup.c ]; then ./runcpatch.sh android-kernel/kernel/cgroup/cgroup.c; fi

      - name: LXC/Docker - 应用 xt_qtaguid 补丁
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ -f android-kernel/net/netfilter/xt_qtaguid.c ]; then
            wget https://raw.githubusercontent.com/wu17481748/android-lxc-docker/refs/heads/main/xt_qtaguid.patch
            patch -p0 < xt_qtaguid.patch
          fi

      - name: LXC/Docker - 禁用 ANDROID_PARANOID_NETWORK
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' android-kernel/arch/arm64/configs/sirius_defconfig
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/sirius_defconfig

      - name: KVM - 启用配置
        if: env.ENABLE_KVM == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          echo "CONFIG_VIRTUALIZATION=y" >> android-kernel/arch/arm64/configs/sirius_defconfig
          echo "CONFIG_KVM=y" >> android-kernel/arch/arm64/configs/sirius_defconfig
          echo "CONFIG_VHOST_NET=y" >> android-kernel/arch/arm64/configs/sirius_defconfig
          echo "CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y" >> android-kernel/arch/arm64/configs/sirius_defconfig

      - name: 开始构建内核
        id: build_kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH

          echo "=== 当前使用的编译器/链接器 ==="
          clang --version | head -n2
          which aarch64-linux-android-ld || { echo "!! 未找到 aarch64-linux-android-ld"; exit 1; }
          which arm-linux-androideabi-ld  || { echo "!! 未找到 arm-linux-androideabi-ld"; exit 1; }
          aarch64-linux-android-ld --version | head -n1

          export KBUILD_BUILD_HOST=Github@EnderPhantomWing
          export KBUILD_BUILD_USER=EnderPhantomWing

          BUILD_TIME=$(date -u +%Y%m%dT%H%M%SZ)
          COMMIT_SHORT=${GITHUB_SHA:0:10}
          RUN_NUMBER=$(printf "%05d" "${{ github.run_number }}")
          export LOCALVERSION="-g${COMMIT_SHORT}-${RUN_NUMBER}-${BUILD_TIME}"
          echo "LOCALVERSION=${LOCALVERSION}"

          export LD="$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin/aarch64-linux-android-ld"
          export LD_COMPAT="$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin/arm-linux-androideabi-ld"

          make -j$(nproc --all) O=out ARCH=arm64 sirius_defconfig

          if [ "$ENABLE_BBR" = "true" ]; then
            echo "启用 BBR..."
            ./scripts/config --file out/.config \
              --enable CONFIG_TCP_CONG_BBR \
              --enable CONFIG_NET_SCH_FQ
            make O=out olddefconfig
          else
            echo "不启用 BBR..."
          fi

          if [ "$ENABLE_LXC_DOCKER" = "true" ]; then
            KCFLAGS_EXTRA="-Wno-error=sizeof-array-div -fuse-ld=bfd"
          else
            KCFLAGS_EXTRA="-fuse-ld=bfd"
          fi

          if [ "$ENABLE_SUSFS" = "true" ]; then
            ./scripts/config --file out/.config \
              --enable KSU --enable KSU_SUSFS --enable KSU_MANUAL_HOOK --disable KSU_TRACEPOINT_HOOK
          else
            ./scripts/config --file out/.config \
              --enable KSU --enable KSU_MANUAL_HOOK --disable KSU_SUSFS --disable KSU_TRACEPOINT_HOOK
          fi

          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            ./scripts/config --file out/.config \
              --enable CONFIG_NOMOUNT --enable CONFIG_KEYS
          else
            ./scripts/config --file out/.config --disable CONFIG_NOMOUNT
          fi

          ./scripts/config --file out/.config \
            --enable NAMESPACES --enable DEVTMPFS --disable USER_NS \
            --enable DEVTMPFS_MOUNT --enable SECTION_MISMATCH_WARN_ONLY

          make O=out ARCH=arm64 olddefconfig

          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            grep -qx 'CONFIG_NOMOUNT=y' out/.config && grep -qx 'CONFIG_KEYS=y' out/.config \
              || { echo "NoMount 或 CONFIG_KEYS 配置未生效，终止编译"; exit 1; }
          elif grep -Eq '^CONFIG_NOMOUNT=(y|m)$' out/.config; then
            echo "NoMount 未关闭，终止编译"
            exit 1
          fi

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD="$LD" \
            LD_COMPAT="$LD_COMPAT" \
            KCFLAGS="$KCFLAGS_EXTRA"

          KERNEL_VERSION=$(cat out/include/config/kernel.release 2>/dev/null \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$KERNEL_VERSION" ]; then KERNEL_VERSION="unknown"; fi
          echo "KERNEL_VERSION=${KERNEL_VERSION}"
          echo "$KERNEL_VERSION" > "$GITHUB_WORKSPACE/kernel_workspace/kernel_version_${{ matrix.root }}.txt"

      - name: 创建 AK3 后缀
        id: gen_name
        run: |
          if [ "${{ matrix.root }}" = "resukisu" ]; then
            NAME="sirius-SDM710-BakaSU"
          else
            NAME="sirius-SDM710-RKSU"
          fi
          if [ "$ENABLE_LXC_DOCKER" = "true" ]; then NAME="${NAME}-Docker"; fi
          if [ "$ENABLE_KVM" = "true" ]; then NAME="${NAME}-KVM"; fi
          if [ "$ENABLE_BBR" = "true" ]; then NAME="${NAME}-BBR"; fi
          if [ "$ENABLE_SUSFS" = "true" ]; then NAME="${NAME}-SUSFS"; fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then NAME="${NAME}-NoMount"; fi
          echo "artifact_name=${NAME}" >> $GITHUB_OUTPUT
          echo "产物名称: ${NAME}"

      - name: 构建 AnyKernel3 包
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          ZIP_NAME="${{ steps.gen_name.outputs.artifact_name }}.zip"
          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" .)
          ls -lh "${ZIP_NAME}"

      - name: 上传版本信息
        uses: actions/upload-artifact@v4
        with:
          name: version-info-${{ matrix.root }}
          path: |
            kernel_workspace/kernel_version_${{ matrix.root }}.txt
            kernel_workspace/manager_version_${{ matrix.root }}.txt
          if-no-files-found: warn

      - name: 上传 AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ak3-${{ matrix.root }}
          path: kernel_workspace/${{ steps.gen_name.outputs.artifact_name }}.zip

      - name: 重命名内核镜像（带 root 后缀）
        run: |
          cp kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz \
             kernel_workspace/Image-${{ matrix.root }}.gz

      - name: 上传内核镜像
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ matrix.root }}
          path: kernel_workspace/Image-${{ matrix.root }}.gz

  release:
    needs: [setup-matrix, prepare, build]
    if: |
      needs.setup-matrix.outputs.total-count != '0' &&
      needs.setup-matrix.outputs.root-configs != '["none"]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成版本摘要
        id: version_summary
        run: |
          ROOT_CONFIGS='${{ needs.setup-matrix.outputs.root-configs }}'
          SUMMARY=""
          for root in $(echo "$ROOT_CONFIGS" | jq -r '.[]'); do
            KV_FILE="artifacts/kernel_version_${root}.txt"
            MV_FILE="artifacts/manager_version_${root}.txt"
            if [ -f "$KV_FILE" ]; then KV=$(cat "$KV_FILE"); else KV="未知"; fi
            if [ -f "$MV_FILE" ]; then MV=$(cat "$MV_FILE"); else MV="未知"; fi
            SUMMARY="${SUMMARY}${root}: Kernel=${KV}, Manager=${MV}\n"
          done
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 将变量输出到摘要
        id: output_summary
        run: |
          ROOT_CONFIGS='${{ needs.setup-matrix.outputs.root-configs }}'
          ENABLE_SUSFS='${{ inputs.enable_susfs }}'
          ENABLE_NOMOUNT='${{ inputs.enable_nomount }}'
          ENABLE_BBR='${{ inputs.enable_bbr }}'
          ENABLE_LXC_DOCKER='${{ inputs.enable_lxc_docker }}'
          ENABLE_KVM='${{ inputs.enable_kvm }}'
          {
            echo "### Build Variables Summary"
            echo ""
            echo "| Variable | Value |"
            echo "|------|-----|"
            echo "| **Branch** | 默认分支 |"
            echo "| **Root Config** | $ROOT_CONFIGS |"
            echo "| **Total** | ${{ needs.setup-matrix.outputs.total-count }} |"
            echo "| **Publish Tag** | ${{ needs.prepare.outputs.tag }} |"
            echo "| **Enable SUSFS** | ${{ inputs.enable_susfs }} |"
            echo "| **Enable NoMount** | ${{ inputs.enable_nomount }} |"
            echo "| **Enable BBR** | ${{ inputs.enable_bbr }} |"
            echo "| **Enable LXC/Docker** | ${{ inputs.enable_lxc_docker }} |"
            echo "| **Enable KVM** | ${{ inputs.enable_kvm }} |"
            echo ""
            echo "### Build Matrix"
            echo ""
            echo "| Root Type | Artifact Name | Kernel Version | Root Manager Version |"
            echo "|-----------|---------------|----------|------------|"
            for root in $(echo "$ROOT_CONFIGS" | jq -r '.[]'); do
              if [ "$root" = "resukisu" ]; then NAME="sirius-SDM710-BakaSU"
              elif [ "$root" = "kernelsu" ]; then NAME="sirius-SDM710-RKSU"
              else NAME="sirius-SDM710-$root"; fi
              if [ "$ENABLE_LXC_DOCKER" = "true" ]; then NAME="${NAME}-Docker"; fi
              if [ "$ENABLE_KVM" = "true" ]; then NAME="${NAME}-KVM"; fi
              if [ "$ENABLE_BBR" = "true" ]; then NAME="${NAME}-BBR"; fi
              if [ "$ENABLE_SUSFS" = "true" ]; then NAME="${NAME}-SUSFS"; fi
              if [ "$ENABLE_NOMOUNT" = "true" ]; then NAME="${NAME}-NoMount"; fi
              KV_FILE="artifacts/kernel_version_${root}.txt"
              MV_FILE="artifacts/manager_version_${root}.txt"
              if [ -f "$KV_FILE" ]; then KV=$(cat "$KV_FILE"); else KV="N/A"; fi
              if [ -f "$MV_FILE" ]; then MV=$(cat "$MV_FILE"); else MV="N/A"; fi
              echo "| $root | ak3-$root / ${NAME}.zip | $KV | $MV |"
            done
            echo ""
            echo "### Environment Infomation"
            echo ""
            echo "| Variable | Value |"
            echo "|------|-----|"
            echo "| **Commit SHA** | ${{ github.sha }} |"
            echo "| **Action Run Number** | ${{ github.run_number }} |"
            echo "| **Action Name** | Build Kernel for sirius-SDM710 |"
          } >> $GITHUB_STEP_SUMMARY
          {
            echo "summary_release<<EOF"
            echo "### Build Variables Summary"
            echo ""
            echo "| Variable | Value |"
            echo "|------|-----|"
            echo "| **Branch** | 默认分支 |"
            echo "| **Root Config** | $ROOT_CONFIGS |"
            echo "| **Total** | ${{ needs.setup-matrix.outputs.total-count }} |"
            echo "| **Publish Tag** | ${{ needs.prepare.outputs.tag }} |"
            echo "| **Enable SUSFS** | ${{ inputs.enable_susfs }} |"
            echo "| **Enable NoMount** | ${{ inputs.enable_nomount }} |"
            echo "| **Enable BBR** | ${{ inputs.enable_bbr }} |"
            echo "| **Enable LXC/Docker** | ${{ inputs.enable_lxc_docker }} |"
            echo "| **Enable KVM** | ${{ inputs.enable_kvm }} |"
            echo ""
            echo "### Environment Infomation"
            echo ""
            echo "| Variable | Value |"
            echo "|------|-----|"
            echo "| **Commit SHA** | ${{ github.sha }} |"
            echo "| **Action Run Number** | ${{ github.run_number }} |"
            echo "| **Action Name** | Build Kernel for sirius-SDM710 |"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 列出已下载文件
        run: find artifacts -type f

      - name: 创建发布并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: |
            Automated release
            | Commit ${{ github.sha }} | Build #${{ github.run_number }} |
            Kernel / Manager Version Summary: 
            ${{ steps.version_summary.outputs.summary }}
            ${{ steps.output_summary.outputs.summary_release }}
          files: |
            artifacts/*.zip
            artifacts/*.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
